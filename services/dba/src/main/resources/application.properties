quarkus.rest-client.dba.url=https://www.dba.dk/recommerce/forsale/search/api
quarkus.lambda.handler=dbaHandler
quarkus.snapstart.enable=true

# SQS configuration
quarkus.sqs.aws.region=eu-central-1
dba.sqs.queue-url=${DBA_EVENTS_QUEUE_URL:http://localhost:4566/000000000000/dba-events}
dba.search.limit=${DBA_SEARCH_LIMIT:20}
quarkus.native.container-build=false