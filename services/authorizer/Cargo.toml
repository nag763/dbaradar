[package]
name = "authorizer"
version = "0.1.0"
edition = "2021"

[dependencies]
aws-config = "1.10.1"
aws-sdk-ssm = "1.118.0"
aws_lambda_events = { version = "1.2.0", default-features = false, features = ["apigw", "builders"] }
ipnet = "2.12.0"

lambda_runtime = "1.0.1"
serde = "1"
serde_json = "1.0.151"
tokio = { version = "1", features = ["macros"] }

[dev-dependencies]
mockito = "1.6"

[profile.release]
strip = false
lto = "fat"
codegen-units = 16
panic = "unwind"
